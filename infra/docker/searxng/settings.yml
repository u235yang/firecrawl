# Secrets are injected by Docker Compose.  Do not put credential values here.
use_default_settings:
  engines:
    keep_only:
      - 360search
      - yandex
      - bing

server:
  limiter: false
  image_proxy: false

search:
  safe_search: 0
  autocomplete: ""
  formats:
    - html
    - json

engines:
  - name: exa
    engine: exa
    shortcut: exa
    categories:
      - general
      - web
    api_key_env: EXA_API_KEY
    timeout: 15.0
    disabled: false

  - name: 360search
    engine: 360search
    shortcut: 360so
    timeout: 20.0
    disabled: false

  - name: yandex
    engine: yandex
    shortcut: yd
    categories:
      - general
    search_type: web
    timeout: 15.0
    disabled: false

  - name: bing
    engine: bing
    shortcut: bi
    timeout: 15.0
    disabled: false
