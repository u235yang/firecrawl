# Secrets are injected by Docker Compose.  Do not put credential values here.
use_default_settings:
  engines:
    keep_only:
      - 360search
      - yandex
      - bing

server:
  limiter: false
  image_proxy: false

search:
  safe_search: 0
  autocomplete: ""
  formats:
    - html
    - json

engines:
  - name: exa
    engine: exa
    shortcut: exa
    categories:
      - general
      - web
    api_key_env: EXA_API_KEY
    timeout: 15.0
    disabled: false

  - name: 360search
    engine: 360search
    shortcut: 360so
    timeout: 20.0
    disabled: false

  - name: yandex
    engine: yandex
    shortcut: yd
    categories:
      - general
    search_type: web
    timeout: 15.0
    disabled: false

  - name: bing
    # The built-in Bing parser returns an empty result set after Bing redirects
    # this mainland-China deployment to cn.bing.com.  Keep the engine name
    # stable for Firecrawl, but parse the current China result page explicitly.
    engine: xpath
    shortcut: bi
    categories:
      - general
      - web
    paging: false
    search_url: https://cn.bing.com/search?q={query}
    results_xpath: //ol[@id="b_results"]/li[contains(@class, "b_algo")]
    url_xpath: .//h2/a/@href
    title_xpath: .//h2/a
    content_xpath: .//div[contains(@class, "b_caption")]/p
    timeout: 15.0
    disabled: false
